<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Background: deep space with slight nebula tint -->
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#050612"/>
    </radialGradient>
    <!-- Soft glow around the sparkle -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c7d2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Background stars — scattered, varying opacity -->
  <circle cx="5"  cy="5"  r="0.75" fill="white" opacity="0.7"/>
  <circle cx="27" cy="4"  r="1"    fill="white" opacity="0.9"/>
  <circle cx="29" cy="20" r="0.6"  fill="white" opacity="0.55"/>
  <circle cx="3"  cy="23" r="0.65" fill="white" opacity="0.5"/>
  <circle cx="24" cy="28" r="0.7"  fill="white" opacity="0.65"/>
  <circle cx="8"  cy="28" r="0.5"  fill="white" opacity="0.45"/>

  <!-- Glow halo behind sparkle -->
  <circle cx="16" cy="16" r="10" fill="url(#glow)"/>

  <!--
    4-pointed sparkle (✦)
    Outer radius 9.5 at N/E/S/W, inner radius 2 at diagonals.
    Gives the classic sharp-tipped star used by premium apps.
  -->
  <polygon
    points="16,6.5  18.1,13.9  25.5,16  18.1,18.1  16,25.5  13.9,18.1  6.5,16  13.9,13.9"
    fill="white"/>
</svg>
